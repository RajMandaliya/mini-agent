[package]
name = "mini-agent"
version = "0.2.0"
edition = "2021"
description = "A minimal, extensible AI agent framework — async-first, multi-provider, tool-integrated"
license = "MIT"
repository = "https://github.com/RajMandaliya/mini-agent"
readme = "README.md"
keywords = ["ai", "agent", "llm", "async", "tools"]
categories = ["api-bindings", "asynchronous"]

[lib]
name = "mini_agent"
path = "src/lib.rs"

[[example]]
name = "simple"
path = "examples/simple.rs"

[[example]]
name = "streaming"
path = "examples/streaming.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "1"
futures = "0.3"
tokio-stream = "0.1"